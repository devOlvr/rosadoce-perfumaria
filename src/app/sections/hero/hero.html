<section id="inicio" class="hero" aria-labelledby="hero-title">
  <div class="container">
    <div class="content">
      <p class="eyebrow-line">A beleza de ser você</p>

      <h1 id="hero-title" class="title">
        <span class="line-1">Sua essência,</span>
        <span class="line-2">sua marca.</span>
      </h1>

      <p class="lead">Descubra fragrâncias que transformam momentos em memórias inesquecíveis.</p>

      <a class="btn btn-primary cta" href="#colecao">
        Conheça nossa coleção
        <app-icon name="arrow-right" [size]="16" />
      </a>

      <p class="note">
        <app-icon name="sparkles" [size]="16" [stroke]="1.4" />
        Essências únicas. Memórias eternas.
      </p>
    </div>
  </div>

  <div class="foot">
    <a class="discover" href="#sobre">
      <app-icon name="arrow-down" [size]="14" />
      Descubra o universo Rosa Doce
    </a>
    <p class="signature">Delicadeza em sua forma mais pura</p>
  </div>
</section>
